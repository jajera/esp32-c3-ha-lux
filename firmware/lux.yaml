# ESP32-C3 lux node for Home Assistant.
# Ships without home Wi-Fi credentials: onboard via SoftAP QR, captive portal, or Improv.
# Mode, schedule, and night thresholds are set from HA and stored in NVS (work offline).

substitutions:
  name: esp32-c3-ha-lux
  friendly_name: ESP32-C3 HA Lux
  ap_ssid: Lux Setup
  ap_password: setup1234
  timezone: Pacific/Auckland

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: jajera.esp32-c3-ha-lux
    version: "1.0.0"
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            lambda: return !wifi::global_wifi_component->has_sta();
          then:
            - display.page.show: page_setup

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:
  encryption: {}

ota:
  - platform: esphome

dashboard_import:
  package_import_url: github://jajera/esp32-c3-ha-lux/firmware/lux.yaml@main
  import_full_config: true

wifi:
  ap:
    ssid: ${ap_ssid}
    password: ${ap_password}
  on_connect:
    - display.page.show: page_run
  on_disconnect:
    - if:
        condition:
          lambda: return !wifi::global_wifi_component->has_sta();
        then:
          - display.page.show: page_setup

captive_portal:

improv_ble:
  authorizer: none

improv_serial:

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}

i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true

spi:
  clk_pin: GPIO1
  mosi_pin: GPIO0

globals:
  - id: night_is_dark
    type: bool
    restore_value: false
    initial_value: "false"

sensor:
  - platform: veml7700
    address: 0x10
    update_interval: 5s
    ambient_light:
      name: Illuminance
      id: lux_lx
      unit_of_measurement: lx
      accuracy_decimals: 0
      filters:
        - clamp:
            min_value: 0
            max_value: 120000

  - platform: wifi_signal
    id: wifi_rssi_db
    name: WiFi Signal
    entity_category: diagnostic
    update_interval: 10s

  - platform: uptime
    name: Uptime
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      internal: true
    ssid:
      id: wifi_ssid_ts
      internal: true

  - platform: template
    name: Mode Label
    id: mode_label
    entity_category: diagnostic
    update_interval: 2s
    lambda: |-
      if (!id(control_mode).has_state())
        return {"Off"};
      return {id(control_mode).current_option().str()};

datetime:
  - platform: template
    type: time
    name: Schedule Start
    id: sched_start
    entity_category: config
    icon: mdi:clock-start
    optimistic: true
    restore_value: true
    initial_value: "18:00:00"

  - platform: template
    type: time
    name: Schedule End
    id: sched_end
    entity_category: config
    icon: mdi:clock-end
    optimistic: true
    restore_value: true
    initial_value: "23:00:00"

number:
  - platform: template
    name: Night On Lux
    id: night_on_lx
    entity_category: config
    unit_of_measurement: lx
    min_value: 0
    max_value: 1000
    step: 1
    initial_value: 20
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: Night Off Lux
    id: night_off_lx
    entity_category: config
    unit_of_measurement: lx
    min_value: 0
    max_value: 2000
    step: 1
    initial_value: 40
    optimistic: true
    restore_value: true
    mode: box

select:
  - platform: template
    name: Mode
    id: control_mode
    icon: mdi:cog
    optimistic: true
    restore_value: true
    initial_option: "Off"
    options:
      - "Off"
      - "Schedule"
      - "Night"
    on_value:
      then:
        - script.execute: apply_mode

button:
  - platform: factory_reset
    id: factory_reset_btn
    name: Factory Reset

  - platform: restart
    name: Restart

binary_sensor:
  - platform: gpio
    id: boot_btn
    internal: true
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    on_click:
      - min_length: 5s
        max_length: 30s
        then:
          - button.press: factory_reset_btn

output:
  - platform: gpio
    id: led_gpio
    pin: GPIO6

  - platform: ledc
    id: backlight_pwm
    pin: GPIO21

light:
  - platform: binary
    name: LED
    id: led_light
    output: led_gpio
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: monochromatic
    id: backlight
    output: backlight_pwm
    internal: true
    restore_mode: ALWAYS_OFF

switch:
  - platform: template
    name: Display
    id: tft_enable
    icon: mdi:monitor
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - light.turn_on:
          id: backlight
          brightness: 100%
    turn_off_action:
      - light.turn_off: backlight

script:
  - id: apply_mode
    mode: single
    then:
      - lambda: |-
          if (!id(control_mode).has_state())
            return;
          const std::string mode = id(control_mode).current_option().str();
          if (mode == "Off")
            return;

          if (mode == "Schedule") {
            auto t = id(sntp_time).now();
            if (!t.is_valid())
              return;
            const int now_m = t.hour * 60 + t.minute;
            const int start_m = (int) id(sched_start).hour * 60 + (int) id(sched_start).minute;
            const int end_m = (int) id(sched_end).hour * 60 + (int) id(sched_end).minute;
            bool in_window = false;
            if (start_m == end_m) {
              in_window = false;
            } else if (start_m < end_m) {
              in_window = now_m >= start_m && now_m < end_m;
            } else {
              in_window = now_m >= start_m || now_m < end_m;
            }
            if (in_window) {
              if (!id(led_light).current_values.is_on())
                id(led_light).turn_on().perform();
            } else {
              if (id(led_light).current_values.is_on())
                id(led_light).turn_off().perform();
            }
            return;
          }

          if (mode == "Night") {
            if (!id(lux_lx).has_state())
              return;
            const float lux = id(lux_lx).state;
            const float on_th = id(night_on_lx).state;
            const float off_th = id(night_off_lx).state;
            if (lux <= on_th)
              id(night_is_dark) = true;
            else if (lux >= off_th)
              id(night_is_dark) = false;
            if (id(night_is_dark)) {
              if (!id(led_light).current_values.is_on())
                id(led_light).turn_on().perform();
            } else {
              if (id(led_light).current_values.is_on())
                id(led_light).turn_off().perform();
            }
          }

interval:
  - interval: 15s
    then:
      - script.execute: apply_mode

font:
  - file: "gfonts://Roboto@500"
    id: font_big
    size: 36
  - file: "gfonts://Roboto"
    id: font_text
    size: 18
  - file: "gfonts://Roboto"
    id: font_small
    size: 14
  - file: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf"
    id: font_mdi
    size: 26
    glyphs:
      - "\U000F0432"  # qrcode
      - "\U000F0C90"  # ip-network-outline
      - "\U000F05AA"  # wifi-off
      - "\U000F091F"  # wifi-strength-1
      - "\U000F0922"  # wifi-strength-2
      - "\U000F0925"  # wifi-strength-3
      - "\U000F0928"  # wifi-strength-4
      - "\U000F0379"  # monitor
      - "\U000F06E8"  # lightbulb-on
      - "\U000F0336"  # lightbulb-outline
  - file: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf"
    id: font_mdi_lg
    size: 40
    glyphs:
      - "\U000F05A8"  # white-balance-sunny

qr_code:
  - id: setup_qr
    value: "WIFI:S:${ap_ssid};T:WPA;P:${ap_password};;"

display:
  - platform: mipi_spi
    model: ST7789V
    dimensions:
      width: 240
      height: 240
    invert_colors: true
    cs_pin: GPIO10
    dc_pin: GPIO3
    reset_pin: GPIO7
    update_interval: 2s
    pages:
      - id: page_run
        lambda: |-
          it.fill(Color::BLACK);
          const auto teal = Color(100, 210, 180);
          const auto amber = Color(255, 190, 60);
          const auto muted = Color(140, 150, 160);
          const auto grey = Color(90, 90, 90);
          const auto line = Color(50, 58, 64);

          const char *wifi_icon = "\U000F05AA";
          if (wifi::global_wifi_component->is_connected()) {
            int8_t rssi = -100;
            if (id(wifi_rssi_db).has_state())
              rssi = (int8_t) id(wifi_rssi_db).state;
            if (rssi >= -55)
              wifi_icon = "\U000F0928";
            else if (rssi >= -65)
              wifi_icon = "\U000F0925";
            else if (rssi >= -75)
              wifi_icon = "\U000F0922";
            else
              wifi_icon = "\U000F091F";
          }
          it.print(12, 8, id(font_mdi), teal, TextAlign::TOP_LEFT, wifi_icon);
          if (id(wifi_ssid_ts).has_state() && !id(wifi_ssid_ts).state.empty()) {
            it.printf(46, 12, id(font_text), Color::WHITE, TextAlign::TOP_LEFT, "%.12s",
                      id(wifi_ssid_ts).state.c_str());
          } else {
            it.print(46, 12, id(font_text), grey, TextAlign::TOP_LEFT, "—");
          }
          if (id(wifi_rssi_db).has_state()) {
            it.printf(228, 14, id(font_small), muted, TextAlign::TOP_RIGHT, "%ddBm",
                      (int) id(wifi_rssi_db).state);
          }

          it.filled_rectangle(12, 42, 216, 1, line);

          it.print(120, 46, id(font_mdi_lg), amber, TextAlign::TOP_CENTER, "\U000F05A8");
          if (id(lux_lx).has_state()) {
            it.printf(120, 90, id(font_big), amber, TextAlign::TOP_CENTER, "%.0f", id(lux_lx).state);
          } else {
            it.print(120, 90, id(font_big), grey, TextAlign::TOP_CENTER, "---");
          }
          it.print(120, 128, id(font_small), muted, TextAlign::TOP_CENTER, "lx");

          const char *mode = "Off";
          if (id(control_mode).has_state() && !id(control_mode).current_option().empty())
            mode = id(control_mode).current_option().c_str();
          it.printf(12, 180, id(font_text), Color::WHITE, TextAlign::TOP_LEFT, "%s", mode);

          const bool led_on = id(led_light).current_values.is_on();
          it.print(228, 176, id(font_mdi), led_on ? amber : grey, TextAlign::TOP_RIGHT,
                   led_on ? "\U000F06E8" : "\U000F0336");

          it.filled_rectangle(12, 200, 216, 1, line);

          it.print(12, 224, id(font_mdi), muted, TextAlign::CENTER_LEFT, "\U000F0C90");
          if (id(wifi_ip).has_state() && !id(wifi_ip).state.empty()) {
            it.printf(46, 224, id(font_text), muted, TextAlign::CENTER_LEFT, "%s",
                      id(wifi_ip).state.c_str());
          } else {
            it.print(46, 224, id(font_text), grey, TextAlign::CENTER_LEFT, "—");
          }
          it.print(228, 224, id(font_mdi), teal, TextAlign::CENTER_RIGHT, "\U000F0379");
      - id: page_setup
        lambda: |-
          it.fill(Color::BLACK);
          it.print(14, 8, id(font_mdi), Color(120, 200, 255), TextAlign::TOP_LEFT, "\U000F0432");
          it.print(120, 12, id(font_text), Color::WHITE, TextAlign::TOP_CENTER, "Scan to set up");
          const int scale = 5;
          const int size = id(setup_qr).get_size() * scale;
          it.filled_rectangle(120 - size / 2 - 6, 120 - size / 2 - 6, size + 12, size + 12, Color::WHITE);
          it.qr_code(120 - size / 2, 120 - size / 2, id(setup_qr), Color::BLACK, scale);
          it.print(120, 232, id(font_text), Color::WHITE, TextAlign::BOTTOM_CENTER, "${ap_ssid}");
